<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DiploBot IA · Tutor pedagógico</title>
<style>
:root{--ink:#17294d;--bg:#f3f6fa;--card:#fff;--line:#d9e1ec;--teal:#0f8b8d;--soft:#e4f4f4;--mut:#5b6b85;--user:#17294d;--userfg:#fff}
@media (prefers-color-scheme:dark){:root{--ink:#e8eef8;--bg:#0f1a2e;--card:#17253f;--line:#2b3d5e;--teal:#4cc3c5;--soft:#173a45;--mut:#9fb0cc;--user:#2b4a82;--userfg:#fff}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;justify-content:center}
.app{width:100%;max-width:820px;height:100%;display:flex;flex-direction:column;background:var(--bg)}
header{padding:14px 18px;display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--line);background:var(--card)}
.logo{flex:none;width:44px;height:44px;border-radius:12px;background:var(--teal);color:#fff;display:grid;place-items:center;font:700 22px Georgia,serif}
h1{font:700 21px Georgia,"Times New Roman",serif;margin:0}
header p{margin:2px 0 0;font-size:13px;color:var(--mut);line-height:1.35}
.reset{margin-left:auto;flex:none;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:7px 11px;font:inherit;font-size:13px;cursor:pointer}
#log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.m{max-width:88%;padding:11px 15px;border-radius:14px;overflow-wrap:anywhere}
.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--teal);border-top-left-radius:4px}
.usr{align-self:flex-end;background:var(--user);color:var(--userfg);border-top-right-radius:4px;white-space:pre-wrap}
.chips,.cards{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start;max-width:96%}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));width:100%;max-width:100%}
button.chip{border:1px solid var(--teal);background:transparent;color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
button.chip:hover{background:var(--soft)}
button.card{text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:12px 14px;font:inherit;cursor:pointer}
button.card:hover{border-color:var(--teal);background:var(--soft)}
button.card b{display:block;font-size:15px}
button.card span{font-size:13px;color:var(--mut)}
.typing{display:flex;gap:5px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--teal);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}
form{display:flex;gap:10px;padding:12px 18px 16px;background:var(--card);border-top:1px solid var(--line)}
textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;padding:10px 13px;font:inherit;background:var(--bg);color:var(--ink);max-height:140px}
.send{flex:none;border:0;background:var(--teal);color:#fff;border-radius:12px;padding:0 20px;font:600 15px inherit;font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.note{font-size:12px;color:var(--mut);text-align:center;padding:0 18px 8px;background:var(--card)}
@media (prefers-reduced-motion:reduce){.typing i{animation:none}#log{scroll-behavior:auto}}
@media (max-width:520px){header p{display:none}.m{max-width:94%}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo" aria-hidden="true">D</div>
  <div><h1>DiploBot IA</h1><p>Tutor pedagógico para la Diplomatura Superior en Gestión del Aprendizaje en Tiempos de la Inteligencia Artificial.</p></div>
  <button class="reset" id="reset" type="button">Nueva conversación</button>
</header>
<main id="log" aria-live="polite" aria-label="Conversación"></main>
<form id="f">
  <label for="in" style="position:absolute;left:-9999px">Escribí tu mensaje</label>
  <textarea id="in" rows="1" placeholder="Escribí acá lo que querés trabajar…" autocomplete="off"></textarea>
  <button class="send" type="submit">Enviar</button>
</form>
<div class="note">DiploBot IA es un tutor guiado que funciona sin conexión. No reemplaza a tus docentes ni inventa material de la cursada.</div>
</div>
<script>
const $=s=>document.querySelector(s), log=$('#log'), inp=$('#in');
const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const md=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^- /gm,'• ').replace(/\n/g,'<br>');
const words=t=>t.trim().split(/\s+/).filter(Boolean).length;
const clip=(t,n=150)=>t.length>n?t.slice(0,n).trim()+'…':t;

/* ---------- Preguntas guía (el usuario decide; el bot pregunta) ---------- */
const QS={
 sit:{l:'Situación',q:'¿Qué situación o problema educativo querés abordar? Contame el contexto: nivel, grupo, materia.',h:'Ejemplo ilustrativo (inventado para orientar): "En un 3.º año, los informes llegan sin fuentes verificadas".'},
 idea:{l:'Idea',q:'Contame tu idea con tus palabras: ¿qué se te ocurrió y para qué situación?',h:'Ejemplo ilustrativo: "Usar un chatbot para que practiquen entrevistas de historia oral".'},
 usoia:{l:'Momento de uso de la IA',q:'¿En qué momento de tu práctica pensás usar IA: planificar, enseñar, dar feedback, evaluar?',h:'Podés pensar en una clase concreta que ya tengas y preguntarte dónde aparece una dificultad real.'},
 apr:{l:'Aprendizaje buscado',q:'¿Qué querés que logren aprender tus estudiantes? Intentá formularlo como algo observable.',h:'Ejemplo ilustrativo: "Que contrasten dos fuentes y justifiquen cuál es más confiable".',r:'Un aprendizaje bien formulado es el ancla del resto: la tecnología se elige después.'},
 ia:{l:'Aporte de la IA',q:'¿Qué aporta realmente la IA acá? ¿Qué pasaría con el aprendizaje si no la usaras?',h:'Fijate si resuelve una dificultad concreta (por ejemplo, feedback inmediato) o si suma solo novedad.',r:'Esta pregunta pesa mucho: importa la intencionalidad pedagógica, no la herramienta.'},
 rol:{l:'Roles',q:'¿Qué harían tus estudiantes **sin** asistencia de IA? ¿Y cuál sería tu rol como docente?',h:'Pensá qué procesos no querrías delegar (leer, argumentar, decidir) y qué te toca orientar a vos.'},
 rie:{l:'Riesgos',q:'¿Qué riesgos o límites ves? Por ejemplo: errores o sesgos de la IA, dependencia, privacidad de datos, acceso y conectividad.',h:'Una opción es imaginar qué saldría mal si un estudiante confía ciegamente en la respuesta de la IA.'},
 eva:{l:'Evidencia de aprendizaje',q:'¿Cómo vas a comprobar que hubo aprendizaje? ¿Qué criterios de evaluación usarías?',h:'Podés partir del aprendizaje que formulaste y preguntarte: ¿qué tendría que mostrar un estudiante para convencerte?'},
 dua:{l:'DUA',q:'Pensando en el DUA: ¿cómo podrían acceder a la información, participar y expresar lo aprendido de más de una manera?',h:'Ejemplo ilustrativo: ofrecer lectura, audio o video (representación) y entrega en texto, audio o esquema (expresión).'},
 cons:{l:'Consigna',q:'Contame o pegá la consigna con la que querés trabajar. ¿Qué entendés que te piden?',h:'Si copiás la consigna textual, puedo usarla como fuente y no interpretar de más.'},
 prod:{l:'Producto',q:'¿Qué producto concreto tenés que entregar y en qué formato?',h:'Buscá en la consigna verbos como "diseñar", "analizar" o "fundamentar": indican qué tipo de producto es.'},
 cri:{l:'Criterios',q:'¿Qué aspectos creés que se van a valorar? Si la consigna o una rúbrica los menciona, citálos.',h:'Si no hay criterios explícitos, podés anotar los que inferís y marcarlos como supuestos.'},
 previo:{l:'Conocimientos previos',q:'¿Qué sabés ya del tema y qué experiencia propia podrías usar como punto de partida?',h:'Tu práctica docente suele ser la mejor fuente de ejemplos situados.'},
 plan:{l:'Primer plan',q:'Armá un borrador de 3 pasos para resolverla. No tiene que ser perfecto: lo revisamos juntos.',h:'Ejemplo ilustrativo de estructura: situación elegida → decisiones → cómo lo evaluarías.'}
};
const MODES={
 propuesta:{seq:['sit','apr','ia','rol','rie','eva','dua'],intro:'Perfecto, diseñemos una propuesta paso a paso. Las decisiones son tuyas; yo te pregunto y te ayudo a fundamentarlas.'},
 idea:{seq:['idea','apr','ia','rol','rie','eva'],intro:'Vamos a analizar tu idea con una mirada pedagógica, sin asumir que es buena o mala de entrada.'},
 usoia:{seq:['usoia','apr','ia','rol','rie','eva'],intro:'Pensemos juntos el uso pedagógico de la IA: primero el para qué, después el con qué.'},
 consigna:{seq:['cons','prod','cri','previo','plan'],intro:'Trabajemos la consigna sin resolverla: primero entenderla bien.'}
};

/* ---------- Glosario general (explicaciones conceptuales, no material de la cátedra) ---------- */
const G=[
 [/\bdua\b|dise[ñn]o universal/i,'Diseño Universal para el Aprendizaje (DUA)','Es un marco que propone planificar desde el inicio para la diversidad, ofreciendo **múltiples formas de representación** (cómo se presenta la información), **de acción y expresión** (cómo se demuestra lo aprendido) y **de participación** (cómo se motiva y se sostiene el compromiso).','¿Dónde de tu práctica ves hoy una sola vía para aprender o para demostrar lo aprendido?'],
 [/sections/i,'Modelo SECTIONS','Es un modelo para seleccionar tecnologías educativas. Sus siglas suelen leerse como: Estudiantes, Facilidad de uso, Costos, Enseñanza y aprendizaje, Interacción, Organización, Novedad y Rapidez. Sirve para decidir con criterios y no por moda.','¿Qué herramienta usás hoy y cómo la evaluarías con esos criterios?'],
 [/ai-?tpack|tpack/i,'TPACK / AI-TPACK','TPACK integra tres tipos de conocimiento docente: **tecnológico, pedagógico y de contenido**. AI-TPACK lo extiende para pensar qué rol cumple la IA en esa integración. La idea central: la tecnología se decide en función del contenido y de la pedagogía.','Pensá una clase tuya: ¿qué contenido, qué estrategia y qué tecnología hay, y cómo se relacionan?'],
 [/samr/i,'Matriz SAMR','Describe niveles de integración tecnológica: **Sustitución, Aumento, Modificación y Redefinición**. Ayuda a ver si la tecnología solo reemplaza lo que ya hacías o permite tareas antes difíciles de plantear. Más alto no siempre es mejor: depende del objetivo.','¿En qué nivel ubicarías una actividad con tecnología que ya hiciste y por qué?'],
 [/r[uú]brica/i,'Rúbrica analítica','Es una matriz con criterios de evaluación y descriptores de desempeño por nivel. Una buena rúbrica usa descriptores **observables** y puede compartirse con los estudiantes para la autoevaluación y la coevaluación.','¿Qué criterio incluirías para evaluar un trabajo tuyo y cómo describirías un buen desempeño?'],
 [/evaluaci[oó]n aut[eé]ntica/i,'Evaluación auténtica','Propone evaluar con tareas cercanas a situaciones reales, donde el estudiante aplica lo aprendido y no solo lo recuerda. Suele combinarse con rúbricas y retroalimentación.','¿Qué tarea real podría mostrar mejor lo que aprenden tus estudiantes que un examen tradicional?'],
 [/feedback|retroalimentaci[oó]n|formativ/i,'Retroalimentación formativa','Es información que ayuda a mejorar mientras se aprende: dice dónde está el estudiante, hacia dónde va y cómo seguir. Es más útil cuando es oportuna, específica y habilita una acción.','¿Qué devolución recibiste alguna vez que realmente te sirvió para mejorar? ¿Qué la hacía útil?'],
 [/andamiaje/i,'Andamiaje','Es un apoyo temporal y ajustable que permite hacer lo que todavía no se podría hacer solo, y que se retira de a poco. Es lo que intento hacer en esta conversación.','¿Qué apoyos ofrecés hoy a tus estudiantes y cómo sabés cuándo retirarlos?'],
 [/educaci[oó]n expandida/i,'Educación expandida','Es la idea de que el aprendizaje ocurre más allá del aula y de lo formal: en redes, espacios comunitarios y entornos digitales. Invita a articular esos contextos con la propuesta de enseñanza.','¿Qué aprendizajes de tus estudiantes ocurren fuera de la escuela y no se están aprovechando?'],
 [/soberan[ií]a tecnol/i,'Soberanía tecnológica','Refiere a la capacidad de decidir de manera informada y autónoma sobre las tecnologías que se usan: quién controla los datos, qué dependencias se generan y qué alternativas existen.','¿De qué plataformas dependés hoy y qué pasaría con tus datos y materiales si dejaras de usarlas?'],
 [/sesgo|alucinaci/i,'Límites de la IA: sesgos y errores','Los sistemas de IA generativa pueden reproducir **sesgos** de sus datos y producir **errores presentados con aplomo** (a veces llamados "alucinaciones"). Por eso se vuelve clave la verificación y la curaduría crítica.','¿Qué estrategia usarías para que tus estudiantes verifiquen lo que responde una IA?'],
 [/mobile|offline|sin conexi[oó]n/i,'Aprendizaje móvil y sin conexión','Es diseñar para que el estudio funcione desde el celular y con conectividad inestable, descargando contenidos y sincronizando después. Es una cuestión de accesibilidad e inclusión.','¿Qué barreras de conectividad enfrentan tus estudiantes y cómo las considerarías al diseñar?'],
 [/inteligencia artificial|\bia\b/i,'IA en educación','En educación, la IA puede apoyar la planificación, la generación de materiales, el feedback o la práctica personalizada. Su valor depende del **problema pedagógico** que se quiere resolver y de los roles que se definan para docentes y estudiantes.','¿Qué problema concreto de tu práctica creés que la IA podría ayudar a resolver (o no)?']
];

/* ---------- Información de la Diplomatura provista en los materiales ---------- */
const KB=[
 [/hoja de ruta|ejes|m[oó]dulos|certificaci[oó]n|valoraci[oó]n docente|cu[aá]ntas horas/i,'Según la **Hoja de ruta** que compartiste:\n- **Eje 1** (sem. 1-4, 100 hs): Marcos de la Educación Expandida y Soberanía Tecnológica.\n- **Eje 2** (sem. 5-9, 100 hs): Plataformas virtuales, Modelo SECTIONS y DUA responsive. Certificación intermedia 1 (200 hs acumuladas).\n- **Eje 3** (sem. 10-14, 100 hs): Didácticas activas, AI-TPACK y Matriz SAMR.\n- **Eje 4** (sem. 15-18, 100 hs): Evaluación auténtica, rúbricas y feedback con IA. Certificación intermedia 2 (400 hs acumuladas).\n- **Cierre** (sem. 19-24, 200 hs): Taller de Trabajo Final Integrador. Titulación final: 600 hs.\n\nLos puntajes y decretos figuran en la tabla original; revisalos ahí para no depender de mi lectura.\n\n¿Querés que analicemos alguno de los ejes?'],
 [/c[aá]psula|padlet/i,'La **Cápsula del Tiempo: Mi Yo Docente ante la IA** es la actividad inaugural. Según la guía, se parte de la pregunta por el lugar que ocupa hoy la IA en tu práctica, y no hay respuestas correctas. Elegís **una** de tres opciones DUA: video (hasta 1 min), audio (hasta 2 min) o texto (hasta 150 palabras). Después publicás en el Padlet y hacés al menos una devolución constructiva a un colega.\n\nNo voy a escribirla por vos, pero podemos explorar qué querés decir. Para empezar: ¿cómo describirías hoy tu relación con la IA en una frase?'],
 [/moodle|campus|descargar curso|aula virtual|app/i,'La **Guía de uso de la plataforma** explica cómo estudiar sin conexión con Moodle Mobile: instalar la app, conectarte al campus (https://pedagotech.milaulas.com/), descargar el curso completo cuando tengas red, trabajar offline y sincronizar al reconectar. Las credenciales están en esa guía y en la guía de la actividad inaugural. Para dudas de acceso hay un foro llamado Consultorio Tecnopedagógico.\n\n¿Tenés alguna duda en un paso concreto?']
];

/* ---------- Estado de la conversación ---------- */
let S;
const fresh=()=>({mode:null,i:0,a:{},nudged:false,stage:0,concept:null,n:0,done:false});
const ACKS=['Gracias por compartirlo.','Bien, eso da un buen punto de partida.','Tomo nota.','Interesante, lo vamos armando.','Queda registrado.'];
const ack=()=>ACKS[S.n++%ACKS.length];

const START=[
 ['Explorar un concepto','Entender una idea clave','concepto'],
 ['Trabajar una consigna','Comprenderla sin resolverla','consigna'],
 ['Diseñar una propuesta','Paso a paso, con tus decisiones','propuesta'],
 ['Analizar una idea','Mirarla con ojo pedagógico','idea'],
 ['Revisar mi producción','Feedback sobre lo que ya escribiste','revisar'],
 ['Pensar el uso pedagógico de la IA','El para qué antes del con qué','usoia']
];

/* ---------- UI ---------- */
function scroll(){log.scrollTop=log.scrollHeight}
function add(cls,html){const d=document.createElement('div');d.className='m '+cls;d.innerHTML=html;log.appendChild(d);scroll();return d}
function clearChips(){log.querySelectorAll('.chips').forEach(c=>c.remove())}
function chips(list){if(!list||!list.length)return;const c=document.createElement('div');c.className='chips';list.forEach(t=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=t;b.onclick=()=>send(t);c.appendChild(b)});log.appendChild(c);scroll()}
function cards(){const c=document.createElement('div');c.className='cards';START.forEach(([t,d,k])=>{const b=document.createElement('button');b.type='button';b.className='card';b.innerHTML='<b>'+t+'</b><span>'+d+'</span>';b.onclick=()=>send('__'+k+'__');c.appendChild(b)});log.appendChild(c);scroll()}
function reply(r){
  const t=add('bot typing','<i></i><i></i><i></i>');
  setTimeout(()=>{t.className='m bot';t.innerHTML=md(r.t);chips(r.chips);scroll()},450+Math.min(r.t.length,500));
}
function send(text){
  text=text.trim();if(!text)return;clearChips();
  const shown=text.startsWith('__')?START.find(s=>'__'+s[2]+'__'===text)[0]:text;
  add('usr',esc(shown));reply(handle(text));
}

/* ---------- Motor conversacional ---------- */
const T={
 menu:['Explorar un concepto','Diseñar una propuesta','Revisar mi producción'],
 off:'Mi función como DiploBot IA es acompañarte en los procesos relacionados con la Diplomatura, la Tecnología Educativa y la Inteligencia Artificial aplicada a la educación. ¿Querés que retomemos desde esa perspectiva?'
};
function begin(mode){
  S=Object.assign(fresh(),{mode});
  if(mode==='concepto'){return {t:'Dale. ¿Qué concepto te gustaría explorar? Por ejemplo: DUA, SECTIONS, AI-TPACK, SAMR, rúbricas, evaluación auténtica, feedback formativo o sesgos de la IA. También podés escribir otro.',chips:['DUA','SAMR','AI-TPACK','Rúbricas']}}
  if(mode==='revisar'){return {t:'Pegá acá la producción que quieras revisar (un texto, una propuesta, una reflexión). Voy a devolverte feedback sin reescribirla: la autoría sigue siendo tuya.'}}
  const m=MODES[mode];return {t:m.intro+'\n\n'+QS[m.seq[0]].q,chips:['Dame una pista']};
}
function recap(){
  const m=MODES[S.mode],rows=m.seq.filter(k=>S.a[k]).map(k=>'- **'+QS[k].l+':** '+clip(S.a[k]));
  const miss=m.seq.filter(k=>!S.a[k]).map(k=>QS[k].l);
  S.done=true;
  return {t:'Llegamos a un primer mapa, armado con **tus** palabras:\n\n'+rows.join('\n')+(miss.length?'\n\nTodavía quedan pendientes: '+miss.join(', ')+'.':'')+'\n\nSiguiente paso: ahora te toca redactarlo como producción propia. ¿Cómo seguimos?',chips:['Revisar coherencia','Pensar la fundamentación','Revisar mi producción','Otro tema']};
}
function coherence(){
  const a=S.a,sig=t=>(t||'').toLowerCase().match(/\p{L}{6,}/gu)||[];
  const A=new Set(sig(a.apr)),over=sig(a.eva).filter(w=>A.has(w));
  let o='Esto es una **interpretación mía** a partir de lo que escribiste:\n';
  o+=over.length?'- Veo vínculo entre el aprendizaje buscado y la evidencia (palabras en común: '+[...new Set(over)].slice(0,4).join(', ')+'). Chequeá que la evidencia realmente muestre ese aprendizaje.\n':'- No veo una conexión explícita entre el aprendizaje buscado y cómo lo vas a evidenciar. ¿Qué haría un estudiante que te muestre ese aprendizaje?\n';
  if(S.a.ia&&!/sin (ia|inteligencia)|no (la )?usar|alternativa|igual/i.test(S.a.ia)) o+='- Pensaste qué aporta la IA, pero no queda claro qué pasaría sin ella. ¿Sería necesaria?\n';
  if(S.a.rol&&!/sin (ia|inteligencia|asistencia)|solos?|manual|propio|mismos/i.test(S.a.rol)) o+='- ¿Está explícito qué tarea hacen los estudiantes sin IA?\n';
  return {t:o+'\n¿Cuál de estos puntos te parece más importante revisar?',chips:['Pensar la fundamentación','Otro tema']};
}
function review(text){
  const f=[],r=[],q=[];
  const has=(re)=>re.test(text);
  has(/\bia\b|inteligencia artificial|chatgpt|gemini|copilot/i)?f.push('Explicitás la presencia de la IA en tu planteo.'):r.push('No aparece con claridad el rol de la IA (o por qué no estaría).');
  has(/aprend(er|an|izaje)|objetivo|logr/i)?f.push('Hay una referencia al aprendizaje que se busca.'):r.push('Falta formular qué aprendizaje buscás promover.');
  has(/por ejemplo|ejemplo|actividad|clase|caso/i)?f.push('Incluís ejemplos o situaciones concretas, que vuelven el texto más situado.'):r.push('Quedaría más claro con una situación o ejemplo concreto.');
  has(/evalu|r[uú]brica|criterio|feedback|devoluci/i)?f.push('Mencionás la evaluación o la retroalimentación.'):(r.push('No veo cómo comprobarías que hubo aprendizaje.'),q.push('¿Qué evidencia te mostraría que el aprendizaje ocurrió?'));
  has(/\bdua\b|accesib|inclus|diversidad|distintas formas|m[uú]ltiples/i)?f.push('Considerás diversidad, accesibilidad o inclusión.'):q.push('¿Cómo podrían participar y expresarse estudiantes con trayectorias distintas?');
  has(/riesgo|sesgo|l[ií]mite|error|privacidad|dependencia/i)||q.push('¿Qué riesgos o límites tendría esta decisión?');
  has(/docente|estudiante|alumn/i)||q.push('¿Qué rol tendrían el docente y los estudiantes?');
  if(words(text)<40)r.push('Es un texto breve: quizás convenga desarrollar más tus fundamentos.');
  if(!f.length)f.push('Tenés un punto de partida sobre el cual construir.');
  const list=a=>a.map(x=>'- '+x).join('\n');
  return {t:'Este feedback es una lectura orientativa de lo que escribiste; la decisión sobre qué cambiar es tuya.\n\n**Fortalezas**\n'+list(f)+'\n\n**Aspectos a revisar**\n'+(r.length?list(r):'- Por ahora no detecto vacíos evidentes en lo formal; revisá la profundidad de tus argumentos.')+'\n\n**Preguntas para profundizar**\n'+(q.length?list(q.slice(0,3)):'- ¿Qué fundamento teórico sostiene tus decisiones?')+'\n\n**Alternativa posible**\n- Probá reordenar tu texto como situación → decisión → justificación.\n\n**Próximo paso**\nElegí un solo aspecto a revisar y reescribilo vos. Si querés, pegame la nueva versión y la miramos.',chips:['Pensar la fundamentación','Otro tema']};
}
function lookup(text){return G.find(g=>g[0].test(text))}
function explain(g,back){return 'Una aclaración: es una explicación **general** del concepto; el enfoque de tu cátedra puede tener matices, y si tenés su material podemos contrastarlo.\n\n**'+g[1]+'**\n'+g[2]+(back||'\n\n'+g[3])}

function handle(raw){
  if(!S)S=fresh();
  const text=raw.replace(/^__(.+)__$/,'$1'),isStart=/^__.+__$/.test(raw);
  const low=text.toLowerCase();
  if(isStart)return begin(text);
  if(/^(otro tema|nuevo tema|reiniciar|empezar de nuevo|cambiar de tema)$/i.test(text)){S=fresh();return {t:'Dale, cambiamos. ¿Qué querés trabajar ahora?',chips:START.map(s=>s[0])}}
  const starts=START.find(s=>s[0].toLowerCase()===low);if(starts)return begin(starts[2]);
  if(/^(pensar la fundamentaci[oó]n)$/i.test(text))return {t:'Fundamentar es explicar **por qué** tomaste cada decisión, apoyándote en un marco o en evidencia. Elegí una decisión central de tu propuesta y respondé: ¿qué autor, modelo o concepto visto en la cursada la sostiene? Si no lo recordás, buscalo en tu material: no voy a inventar referencias.\n\n¿Cuál es esa decisión?'};
  if(/^revisar coherencia$/i.test(text)&&S.done)return coherence();

  /* trabajo completo: reconducir */
  if(/(hac(e|é)me|hac[eé]|escrib[ií]me|resolv[eé]me|armame|redact[aá]me|dame|necesito|quiero)[^.?]*(trabajo|tp|trabajo pr[aá]ctico|actividad|planificaci[oó]n|proyecto|reflexi[oó]n|tfi|c[aá]psula|todo hecho|completo|resuelto)/i.test(text)&&!/^(pegu[eé]|este es)/i.test(text)&&words(text)<30){
    const m=S.mode&&MODES[S.mode]?S.mode:'propuesta';
    S=Object.assign(fresh(),{mode:m});
    return {t:'Claro, podemos trabajarlo juntos. Para empezar, '+QS[MODES[m].seq[0]].q.replace(/^¿/,'¿').replace(/^(.)/,c=>c.toLowerCase()).replace(/^¿qué/,'¿qué'),chips:['Dame una pista']};
  }
  /* saludos y ayuda */
  if(!S.mode&&/^(hola|buenas|buen d[ií]a|buenas tardes|buenas noches|hey)\b/i.test(text))return {t:'¡Hola! ¿Qué te gustaría trabajar hoy?',chips:START.map(s=>s[0])};
  if(/^(gracias|muchas gracias|genial|perfecto|ok)\W*$/i.test(text)&&!S.mode)return {t:'¡De nada! Cuando quieras seguimos. ¿Retomamos algo o abrimos otro tema?',chips:T.menu};
  if(/qu[eé] (pod[eé]s|puedes) hacer|c[oó]mo (funciona|te uso)|para qu[eé] serv[ií]s|ayuda$/i.test(text))return {t:'Puedo acompañarte a **entender conceptos, trabajar consignas, diseñar propuestas, analizar ideas, revisar producciones y pensar el uso de la IA**. Te hago preguntas, te doy pistas y feedback. No escribo trabajos para entregar: te ayudo a construirlos.\n\n¿Con cuál empezamos?',chips:START.map(s=>s[0])};

  /* información de la Diplomatura (solo la provista) */
  if(!S.mode||/diplomatura|hoja de ruta|c[aá]psula|moodle|padlet/i.test(text)){const k=KB.find(k=>k[0].test(text));if(k&&(!S.mode||/hoja de ruta|c[aá]psula|moodle|padlet/i.test(text)))return {t:k[1]}}

  /* modo concepto */
  if(S.mode==='concepto'){
    if(S.stage===0){
      const g=lookup(text);
      if(!g)return {t:'Ese concepto no figura en lo que tengo disponible, y prefiero no inventarte una definición. Si lo compartís desde tu material, lo analizamos juntos. Mientras tanto, ¿qué entendés vos por él?'};
      S.concept=g;S.stage=1;return {t:explain(g)};
    }
    S.stage=2;
    return {t:ack()+' '+(words(text)<15?'Si podés, agregá un ejemplo de tu práctica para que lo veamos más concreto.':'Fijate si podrías sumar un ejemplo concreto de tu práctica y qué límite tendría el concepto allí.')+'\n\n¿Querés explorar otro concepto o llevarlo a una propuesta?',chips:['Diseñar una propuesta','Explorar un concepto','Otro tema']};
  }
  /* pregunta conceptual dentro de otro modo */
  if(/qu[eé] (es|son|significa)|a qu[eé] se refiere|explic[aá]me|defin[ií]/i.test(text)){
    const g=lookup(text);
    if(g){const cur=S.mode&&MODES[S.mode]&&!S.done?'\n\nVolvamos a tu trabajo: '+QS[MODES[S.mode].seq[S.i]].q:'\n\n'+g[3];return {t:explain(g,cur)}}
  }
  /* modo revisar */
  if(S.mode==='revisar'){if(words(text)<15)return {t:'Es muy breve para darte feedback útil. Pegá un poco más de tu producción (al menos unas líneas).'};return review(text)}
  /* modos guiados */
  if(S.mode&&MODES[S.mode]&&!S.done){
    const seq=MODES[S.mode].seq,k=seq[S.i];
    if(/no s[eé]|pista|ejemplo|no entiendo|ayud(a|ame)|trabado|bloquead/i.test(text)&&words(text)<15)return {t:QS[k].h+'\n\nSon solo orientaciones: la respuesta tiene que ser tuya. '+QS[k].q,chips:[]};
    if(words(text)<5&&!S.nudged){S.nudged=true;return {t:'Entiendo. Si podés, desarrollalo un poco más (con un ejemplo o una razón) para que lo trabajemos mejor. Y si estás trabado, pedime una pista.',chips:['Dame una pista']}}
    S.a[k]=text;S.i++;S.nudged=false;
    if(S.i>=seq.length)return recap();
    return {t:ack()+(QS[k].r?' '+QS[k].r:'')+'\n\n'+QS[seq[S.i]].q,chips:['Dame una pista']};
  }
  /* tema ajeno */
  const EDU=/(\bia\b|inteligencia|educa|docen|aula|clase|estudiante|alumno|aprend|ense[ñn]|evalua|dua|consigna|diplomatura|moodle|tecnolog|planific|curr[ií]cul|did[aá]ctic|propuesta|actividad|tfi|escuel|profe)/i;
  if(!EDU.test(text)&&words(text)<30)return {t:T.off,chips:T.menu};
  const g=lookup(text);if(g&&words(text)<25)return {t:explain(g),chips:['Diseñar una propuesta','Otro tema']};
  if(words(text)>=30)return review(text);
  return {t:'Quiero entender mejor qué necesitás. ¿Preferís que exploremos un concepto, trabajemos una consigna, diseñemos una propuesta o revisemos algo que ya escribiste?',chips:START.map(s=>s[0])};
}

/* ---------- Inicio ---------- */
function welcome(){
  S=fresh();log.innerHTML='';
  add('bot',md('¡Hola! Soy DiploBot IA 👋\n\nSoy un tutor pedagógico pensado para acompañarte durante la Diplomatura Superior en Gestión del Aprendizaje en Tiempos de la Inteligencia Artificial.\n\nPuedo ayudarte a comprender conceptos, analizar consignas, diseñar propuestas, revisar tus producciones y reflexionar sobre el uso pedagógico de la IA.\n\n**No estoy para hacer el trabajo por vos, sino para ayudarte a construirlo.**\n\n¿Qué te gustaría trabajar?'));
  cards();
}
$('#f').addEventListener('submit',e=>{e.preventDefault();const t=inp.value;inp.value='';inp.style.height='auto';send(t)});
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#f').requestSubmit()}});
inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,140)+'px'});
$('#reset').onclick=welcome;
welcome();
</script>
